services:
  postgres:
    image: postgres:16-alpine
    container_name: metrookeh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: metrookeh
      POSTGRES_PASSWORD: metrookeh
      POSTGRES_DB: metrookeh
    ports:
      - "5432:5432"
    volumes:
      - metrookeh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrookeh -d metrookeh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  metrookeh_pgdata:
